openapi: 3.0.3
info:
  title: ZK Fitness API
  description: |
    Optional backend for the ZK Fitness platform. The client-owned boundary
    sends public keys, opaque encrypted payloads, and a Groth16 proof over a
    sensitive workout summary and its encrypted-record binding. The API verifies
    the proof and rejects replayed nullifiers. The circuit does not prove
    AES-GCM or ML-KEM internals, and it does not prove that ciphertext decrypts
    to the sensitive workout summary.
  version: 1.0.0
  contact:
    name: Samuel Degnan
    url: https://github.com/samueladegnan/zk-fitness-platform

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://your-api-host.example/api
    description: Example hosted API base URL

paths:
  /health:
    get:
      summary: Health and database connectivity check
      tags: [Health]
      responses:
        '200':
          description: API is healthy and database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOK'
        '503':
          description: API or database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'

  /auth/challenge:
    get:
      summary: Get a proof-of-work challenge for registration
      tags: [Auth]
      responses:
        '200':
          description: A proof-of-work challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'

  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      summary: Authenticate with a post-quantum signature
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login nonce or authenticated session
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginChallengeResponse'
                  - $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      summary: Log out the current session
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/session:
    get:
      summary: Get the current session
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sync:
    get:
      summary: Retrieve the user's encrypted sync payload
      tags: [Sync]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Encrypted payload or empty payload marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Store a new encrypted sync payload
      tags: [Sync]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncData'
      responses:
        '200':
          description: Sync stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: zkfitness_session
      description: HTTP-only JWT session cookie

  schemas:
    HealthOK:
      type: object
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          example: connected
        timestamp:
          type: string
          format: date-time

    HealthError:
      type: object
      properties:
        status:
          type: string
          example: error
        db:
          type: string
          example: disconnected
        timestamp:
          type: string
          format: date-time

    Challenge:
      type: object
      properties:
        nonce:
          type: string
        difficulty:
          type: integer

    RegisterRequest:
      type: object
      required: [username, dsaPublicKey, kemPublicKey, identityCommitment, challenge, solution]
      properties:
        username:
          type: string
          minLength: 3
        dsaPublicKey:
          type: string
          description: Base64 ML-DSA-65 public key
        kemPublicKey:
          type: string
          description: Base64 ML-KEM-768 public key
        identityCommitment:
          type: string
          description: Poseidon commitment to the private proof identity secret
        challenge:
          type: string
          description: Server-issued proof-of-work challenge nonce
        solution:
          type: integer
          description: Proof-of-work solution
        website:
          type: string
          description: Honeypot field. If filled, the request is rejected

    LoginRequest:
      oneOf:
        - $ref: '#/components/schemas/LoginChallengeRequest'
        - $ref: '#/components/schemas/LoginSignatureRequest'

    LoginChallengeRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          description: Username for the first login step

    LoginSignatureRequest:
      type: object
      additionalProperties: false
      required: [username, signature]
      properties:
        username:
          type: string
          description: Username for the second login step
        signature:
          type: string
          description: Base64 ML-DSA-65 signature of the server nonce

    RegisterResponse:
      type: object
      required: [message, username, identityCommitment]
      properties:
        message:
          type: string
          example: User created
        username:
          type: string
        identityCommitment:
          type: string

    LoginChallengeResponse:
      type: object
      required: [nonce]
      properties:
        nonce:
          type: string
          description: Base64 server-issued login nonce

    Session:
      type: object
      required: [username, identityCommitment]
      properties:
        message:
          type: string
          example: Authenticated
          description: Present on successful login and omitted by the session lookup endpoint
        username:
          type: string
        identityCommitment:
          type: string

    SyncData:
      type: object
      required: [encryptedBlob, kemCiphertext, proof, publicSignals, commitment, nullifier, payloadBinding, identityCommitment, circuitVersion]
      properties:
        encryptedBlob:
          type: string
          description: JSON string containing the AES-GCM IV and ciphertext fields
        kemCiphertext:
          type: string
          description: Base64 ML-KEM-768 ciphertext wrapping the AES key
        proof:
          type: object
          description: Groth16 proof generated by the browser
        publicSignals:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: string
        commitment:
          type: string
        nullifier:
          type: string
        payloadBinding:
          type: string
          description: BN254 field reduction of the encrypted blob and KEM ciphertext binding
        identityCommitment:
          type: string
        minWorkoutCount:
          type: integer
          minimum: 0
          maximum: 65534
        minMinutes:
          type: integer
          minimum: 0
          maximum: 4294967294
        circuitVersion:
          type: string
          example: workout-validity-v1

    SyncResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        encryptedBlob:
          type: string
          nullable: true
          description: JSON string containing the AES-GCM IV and ciphertext fields (null when exists is false)
        kemCiphertext:
          type: string
          nullable: true
          description: Base64 ML-KEM-768 ciphertext wrapping the AES key (null when exists is false)
        proof:
          type: object
          nullable: true
          description: Groth16 proof generated by the browser
        publicSignals:
          type: array
          nullable: true
          items:
            type: string
        commitment:
          type: string
          nullable: true
        nullifier:
          type: string
          nullable: true
        payloadBinding:
          type: string
          nullable: true
        circuitVersion:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last sync (null when exists is false)

    SyncStored:
      type: object
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Forbidden:
      description: Access denied for this action
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Locked:
      description: Account temporarily locked after repeated failed login attempts
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
