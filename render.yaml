# Render Blueprint for the ZK Fitness backend.
#
# This deploys the Node.js API and the PostgreSQL database it needs from the
# main branch. Render generates the JWT secret during initial setup.
#
# CLIENT_ORIGIN is the origin only. The repository path does not belong in it.
services:
  - type: web
    name: zk-fitness-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: npm ci
    # Free web services do not support pre-deploy commands. Run the migration
    # during startup before the API begins accepting traffic.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: zk-fitness-db
          property: connectionString
      # Render's managed PostgreSQL certificate is self-signed. TLS remains
      # enabled, but hostname verification must be disabled for this service.
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://samueladegnan.github.io

databases:
  - name: zk-fitness-db
    plan: free
    region: oregon
    postgresMajorVersion: '16'
