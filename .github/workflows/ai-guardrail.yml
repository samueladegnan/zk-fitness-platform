name: AI CICD Security Guardrail

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  security-events: write

jobs:
  guardrail:
    name: Security Guardrail Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Guardrail CLI
        run: python -m pip install --disable-pip-version-check "https://github.com/samueladegnan/ai-cicd-security-guardrail/archive/refs/tags/v1.1.0.tar.gz"

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run npm audit
        run: python3 scripts/run-audit.py

      - name: Generate ESLint SARIF report (backend)
        id: eslint-backend
        continue-on-error: true
        run: |
          cd backend
          npm install --no-save @microsoft/eslint-formatter-sarif
          npx eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file ../backend.sarif

      - name: Generate ESLint SARIF report (frontend)
        id: eslint-frontend
        continue-on-error: true
        run: |
          cd frontend
          npm install --no-save @microsoft/eslint-formatter-sarif
          npx eslint . \
            --format @microsoft/eslint-formatter-sarif \
            --output-file ../frontend.sarif

      - name: AI Guardrail triage (backend)
        id: guardrail-backend
        if: steps.eslint-backend.outcome == 'success'
        # Run the pinned v1.1.0 CLI on the runner so report files are written
        # directly to the workspace. The integration-health workflow continues
        # to verify the reusable Docker action separately.
        run: |
          guardrail "$GITHUB_WORKSPACE/backend.sarif" \
            --format sarif \
            --repo-root "$GITHUB_WORKSPACE" \
            --provider "$GUARDRAIL_LLM_PROVIDER" \
            --output-json "$GITHUB_WORKSPACE/backend-guardrail-report.json" \
            --output-markdown "$GITHUB_WORKSPACE/backend-guardrail-report.md"
        env:
          GUARDRAIL_LLM_PROVIDER: ${{ secrets.AI_GUARD_PROVIDER || 'mock' }}
          GUARDRAIL_LLM_API_KEY: ${{ secrets.AI_GUARD_API_KEY || '' }}
        continue-on-error: true

      - name: AI Guardrail triage (frontend)
        id: guardrail-frontend
        if: steps.eslint-frontend.outcome == 'success'
        # Use the same pinned CLI and provider for the frontend scope.
        run: |
          guardrail "$GITHUB_WORKSPACE/frontend.sarif" \
            --format sarif \
            --repo-root "$GITHUB_WORKSPACE" \
            --provider "$GUARDRAIL_LLM_PROVIDER" \
            --output-json "$GITHUB_WORKSPACE/frontend-guardrail-report.json" \
            --output-markdown "$GITHUB_WORKSPACE/frontend-guardrail-report.md"
        env:
          GUARDRAIL_LLM_PROVIDER: ${{ secrets.AI_GUARD_PROVIDER || 'mock' }}
          GUARDRAIL_LLM_API_KEY: ${{ secrets.AI_GUARD_API_KEY || '' }}
        continue-on-error: true

      - name: Scan for hardcoded secrets
        run: |
          python3 - <<'PY'
          import re, sys, os
          patterns = [
              r'(?i)(api[_-]?key|secret|password|token)\s*=\s*["\'][^"\']{8,}["\']',
              r'sk_live_[a-zA-Z0-9]{24,}',
              r'-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----',
          ]
          hits = 0
          for root, _, files in os.walk('.'):
              if any(x in root for x in ['.git', 'node_modules']):
                  continue
              for f in files:
                  if f.endswith(('.js', '.json', '.yml', '.yaml', '.env.example', '.md')):
                      path = os.path.join(root, f)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as fh:
                              for i, line in enumerate(fh, 1):
                                  for p in patterns:
                                      if re.search(p, line):
                                          print(f'{path}:{i}: {line.strip()}')
                                          hits += 1
                      except Exception:
                          pass
          if hits:
              print(f'Guardrail found {hits} potential secret(s). Review before merging.')
              sys.exit(1)
          print('Guardrail passed: no obvious secrets detected.')
          PY

      - name: Verify Guardrail reports were written
        id: verify-reports
        if: always() && steps.eslint-backend.outcome == 'success' && steps.eslint-frontend.outcome == 'success'
        run: |
          set -e
          test -s backend-guardrail-report.json
          test -s frontend-guardrail-report.json
          echo "Guardrail reports were written to the workspace."

      - name: Validate Guardrail JSON reports
        id: validate-reports
        if: steps.verify-reports.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for filename in ('backend-guardrail-report.json', 'frontend-guardrail-report.json'):
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              if not isinstance(data, dict) or not isinstance(data.get('results'), list):
                  raise SystemExit(f'{filename} is not a valid Guardrail report')
              if 'summary' in data and not isinstance(data['summary'], dict):
                  raise SystemExit(f'{filename} has an invalid summary')
              print(f'Validated {filename}: {len(data["results"])} findings')
          PY

      - name: Build Security Report page
        if: steps.validate-reports.outcome == 'success'
        run: python3 scripts/build-guardrail-report.py

      - name: Commit updated Security Report
        id: commit-report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.validate-reports.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guardrail.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Security Report is already up to date."
          else
            git commit -m "docs: update guardrail security report"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment for updated report
        if: steps.commit-report.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Upload guardrail reports
        if: always() && steps.verify-reports.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-reports
          path: |
            backend-guardrail-report.json
            backend-guardrail-report.md
            frontend-guardrail-report.json
            frontend-guardrail-report.md
